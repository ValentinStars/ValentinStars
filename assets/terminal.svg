<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250">
<defs>
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-bg { fill: #0d1117; rx: 8px; stroke: #30363d; stroke-width: 1px; }
    .header-bg { fill: #161b22; rx: 8px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .code-text { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace; font-size: 12.5px; fill: #c9d1d9; }
    .accent { fill: #e30b5c; font-weight: bold; }
    .muted { fill: #8b949e; }
    .green { fill: #3fb950; }
    .cyan { fill: #79c0ff; }
    .cursor { fill: #e30b5c; animation: blink 1s infinite; }
  </style>
</defs>

<rect width="100%" height="100%" class="term-bg" />
<path d="M 0 8 C 0 3.58 3.58 0 8 0 L 832 0 C 836.42 0 840 3.58 840 8 L 840 30 L 0 30 Z" class="header-bg" />
<line x1="0" y1="30" x2="840" y2="30" stroke="#30363d" stroke-width="1" />

<!-- Terminal window controls -->
<circle cx="20" cy="15" r="5.5" class="dot-red" />
<circle cx="36" cy="15" r="5.5" class="dot-yellow" />
<circle cx="52" cy="15" r="5.5" class="dot-green" />
<text x="420.0" y="19" class="title">valentin@workstation: ~</text>

<!-- Terminal content -->
<g transform="translate(25, 60)" class="code-text">
  <text x="0" y="0"><tspan class="green">valentin@core</tspan><tspan class="muted">:</tspan><tspan class="cyan">~</tspan><tspan class="muted">$</tspan> neofetch</text>
  
  <!-- ASCII & Specs -->
  <g transform="translate(0, 24)">
    <text x="0" y="0" class="accent">   /\_/\  </text>
    <text x="0" y="18" class="accent">  ( o.o ) </text>
    <text x="0" y="36" class="accent">   &gt; ^ &lt;  </text>

    <text x="95" y="0"><tspan class="accent">OS:</tspan> VSTOS (Custom x86_64 / ASM / Grub Bare-Metal)</text>
    <text x="95" y="18"><tspan class="accent">Host:</tspan> ESP32-S3 / M5Stack / Linux Workstation</text>
    <text x="95" y="36"><tspan class="accent">Kernel:</tspan> 6.x-vst-hardened (ARM &amp; x86 custom drivers)</text>
    <text x="95" y="54"><tspan class="accent">Shell:</tspan> zsh (p10k)</text>
    <text x="95" y="72"><tspan class="accent">Org:</tspan> Palka-Community</text>
    <text x="95" y="90"><tspan class="accent">Stack:</tspan> C, C++, Python, ASM, Linux Kernel, Qt6, PlatformIO</text>
    <text x="95" y="108"><tspan class="accent">Motto:</tspan> <tspan class="muted">"Come to the dark side, we have cookies :&gt;"</tspan></text>
  </g>
  
  <text x="0" y="158"><tspan class="green">valentin@core</tspan><tspan class="muted">:</tspan><tspan class="cyan">~</tspan><tspan class="muted">$</tspan> <tspan class="cursor">█</tspan></text>
</g>
</svg>