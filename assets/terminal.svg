    .user { fill: #ff2a6d; font-weight: bold; }
    .host { fill: #ff2a6d; font-weight: bold; }
    .prompt-user { fill: #3fb950; font-weight: bold; }
    .prompt-path { fill: #79c0ff; }
    .bar-filled { fill: #e30b5c; font-weight: bold; }
    .bar-empty { fill: #30363d; }
    .bar-bracket { fill: #8b949e; }
    .sep { fill: #30363d; }
    .cursor { fill: #ff2a6d; animation: blink 1s infinite; }
  </style>
</defs>

